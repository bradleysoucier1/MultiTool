<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MultiTool Hub - Material 3</title>

  <!-- Google Fonts for Material Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Import Maps for Material Web Components -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Load Specific Material Components -->
  <script type="module">
    import '@material/web/tabs/tabs.js';
    import '@material/web/tabs/primary-tab.js';
    import '@material/web/textfield/outlined-text-field.js';
    import '@material/web/button/filled-button.js';
    import '@material/web/button/outlined-button.js';
    import '@material/web/elevation/elevation.js';
  </script>

  <style>
    :root {
      /* Base Material 3 Dark Theme Colors */
      color-scheme: dark;
      --md-sys-color-background: #141218;
      --md-sys-color-on-background: #e6e0e9;
      --md-sys-color-surface: #1d1b20;
      --md-sys-color-surface-container: #211f26;
      --md-sys-color-on-surface: #e6e0e9;
      --md-sys-color-primary: #d0bcff;
      
      --body-font: 'Roboto', system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: var(--body-font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 32px 24px;
      background: var(--md-sys-color-surface);
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--md-sys-color-primary);
    }

    header p {
      color: #cac4d0;
      font-size: 1.1rem;
    }

    .tabs-container {
      display: flex;
      justify-content: center;
      background: var(--md-sys-color-surface);
      border-bottom: 1px solid #49454f;
    }

    md-tabs {
      min-width: 300px;
      max-width: 600px;
      width: 100%;
    }

    .content {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .tool {
      display: none;
      background: var(--md-sys-color-surface-container);
      padding: 32px;
      border-radius: 24px;
      position: relative;
    }

    .tool.active {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-bottom: 24px;
      font-weight: 500;
      font-size: 1.5rem;
      color: var(--md-sys-color-primary);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media(min-width: 600px) {
      .input-group {
        flex-direction: row;
        align-items: center;
      }
      md-outlined-text-field {
        flex: 1;
      }
    }

    md-outlined-text-field {
      width: 100%;
      --md-outlined-text-field-container-shape: 12px;
    }

    /* Calculator Specifics */
    #calcResult {
      margin-top: 24px;
      font-size: 1.5rem;

      padding: 16px;
      background: var(--md-sys-color-surface);
      border-radius: 12px;

    }

    canvas {
      width: 100%;
      max-width: 100%;
      background: #ffffff;

    #notesBox {

      display: flex;

      opacity: 1;
    }

      text-align: center;

    }
  </style>
</head>
<body>

<header>
  <h1>MultiTool Hub</h1>
  <p>Calculator • Graph • Notes</p>
</header>

<!-- Material 3 Tabs -->
<div class="tabs-container">
  <md-tabs id="main-tabs" aria-label="Tool selection tabs">
    <md-primary-tab id="tab-0" aria-controls="calculator" active>Calculator</md-primary-tab>
    <md-primary-tab id="tab-1" aria-controls="graph">Graph</md-primary-tab>
    <md-primary-tab id="tab-2" aria-controls="notes">Notes</md-primary-tab>
  </md-tabs>
</div>

<main class="content">

  <!-- Calculator -->
  <div class="tool active" id="calculator">
    <h2>Calculator</h2>
    <div class="input-group">
      <md-outlined-text-field 
        id="calcInput" 
        label="Expression" 
        placeholder="Example: 5 * (10 + 2)">
      </md-outlined-text-field>
      <md-filled-button onclick="calculate()">Calculate</md-filled-button>
    </div>
    <div id="calcResult">Result: --</div>
  </div>

  <!-- Graph -->
  <div class="tool" id="graph">
    <h2>Graph Tool</h2>
    <div class="input-group">
      <md-outlined-text-field 
        id="graphInput" 
        label="Math Function" 
        placeholder="Example: Math.sin(x)">
      </md-outlined-text-field>
      <md-filled-button onclick="drawGraph()">Draw Graph</md-filled-button>
    </div>
    <canvas id="graphCanvas" width="700" height="350"></canvas>
  </div>

  <!-- Notes -->
  <div class="tool" id="notes">
    <h2>Notes</h2>
    <md-outlined-text-field 
      type="textarea" 
      id="notesBox" 
      label="Your Notes"
      placeholder="Write your thoughts here..." 
      rows="8">
    </md-outlined-text-field>
    
    <div class="action-row">
      <md-filled-button onclick="saveNotes()">Save Notes</md-filled-button>
      <span class="saved" id="saveStatus">Notes saved successfully!</span>
    </div>
  </div>

</main>

<footer>
  MultiTool Hub © 2026 • Built with Material Design 3
</footer>

<script>
  // TAB SYSTEM USING M3 `<md-tabs>`
  const tabs = document.getElementById('main-tabs');
  const tools = document.querySelectorAll('.tool');

  tabs.addEventListener('change', () => {
    // Hide all tools
    tools.forEach(tool => tool.classList.remove('active'));
    // Show the tool that matches the active tab index
    tools[tabs.activeTabIndex].classList.add('active');
  });

  // CALCULATOR
  function calculate() {
    const inputField = document.getElementById("calcInput");
    const resultDiv = document.getElementById("calcResult");
    const input = inputField.value;

    if (!input.trim()) {
      resultDiv.innerText = "Result: --";
      return;
    }

    try {
      // Note: eval is used here per the original code's requirement. 
      // In production, a mathematical parsing library is recommended.
      const result = eval(input);
      resultDiv.innerText = "Result: " + result;
    } catch {
      resultDiv.innerText = "Error: Invalid expression";
    }
  }

  // NOTES
  const notesBox = document.getElementById("notesBox");
  const saveStatus = document.getElementById("saveStatus");

  window.onload = () => {
    const saved = localStorage.getItem("multitool_notes");
    if (saved) {
      notesBox.value = saved;
    }
    // Draw initial empty graph layout
    drawGraph(true);
  }

  function saveNotes() {
    localStorage.setItem("multitool_notes", notesBox.value);
    
    // Show feedback
    saveStatus.classList.add("show");
    setTimeout(() => {
      saveStatus.classList.remove("show");
    }, 2500);
  }

  // GRAPH TOOL
  function drawGraph(isInit = false) {
    const canvas = document.getElementById("graphCanvas");
    const ctx = canvas.getContext("2d");
    const expr = document.getElementById("graphInput").value;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Axes
    ctx.strokeStyle = "#94a3b8"; // Muted color for axes
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    if (isInit || !expr.trim()) return;

    ctx.strokeStyle = "#6750a4"; // M3 Primary Color for the graph line
    ctx.lineWidth = 2.5;
    ctx.beginPath();

    for (let px = 0; px < canvas.width; px++) {
      let x = (px - canvas.width / 2) / 30;
      let y;

      try {
        y = eval(expr);
      } catch (err) {
        // Safe error handling directly on canvas
        ctx.fillStyle = "#ba1a1a"; // M3 Error Color
        ctx.font = "16px Roboto, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Invalid function. Use valid JavaScript Math (e.g., Math.sin(x))", canvas.width / 2, 30);
        return;
      }

      let py = canvas.height / 2 - y * 30;

      if (px === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }

    ctx.stroke();
  }
</script>

</body>
</html>
