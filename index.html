<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Material 3 MultiTool Hub</title>

  <!-- Roboto + Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- Material Web -->
  <script type="importmap">
  {
    "imports": {
      "@material/web/": "https://esm.run/@material/web/"
    }
  }
  </script>

  <script type="module">
    import '@material/web/all.js';
  </script>

  <style>
    :root{
      color-scheme: dark;

      --md-sys-color-primary: #8ec5ff;
      --md-sys-color-surface: #111827;
      --md-sys-color-surface-container: #1e293b;
      --md-sys-color-on-surface: #ffffff;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Roboto, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
    }

    header{
      padding:32px 20px;
      text-align:center;
    }

    header h1{
      font-size:3rem;
      font-weight:700;
      margin-bottom:8px;
    }

    header p{
      opacity:0.8;
      font-size:1.1rem;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap:12px;
      padding:0 20px 24px;
      flex-wrap:wrap;
    }

    .tab-content{
      display:none;
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .tab-content.active{
      display:block;
    }

    md-filled-tonal-button{
      margin-top:16px;
    }

    .card{
      padding:24px;
      border-radius:28px;
      background:#1e293b;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }

    .tool-title{
      font-size:2rem;
      margin-bottom:20px;
      font-weight:600;
    }

    #calcResult{
      margin-top:20px;
      font-size:1.3rem;
      font-weight:500;
    }

    canvas{
      width:100%;
      background:white;
      border-radius:20px;
      margin-top:20px;
    }

    textarea{
      width:100%;
      min-height:300px;
      padding:18px;
      resize:vertical;
      border:none;
      outline:none;
      border-radius:20px;
      background:#334155;
      color:white;
      font-size:1rem;
    }

    .saved{
      margin-top:14px;
      opacity:0.7;
    }

    footer{
      text-align:center;
      padding:40px 20px;
      opacity:0.6;
    }

    md-outlined-text-field{
      width:100%;
      margin-top:12px;
    }
  </style>
</head>

<body>

<header>
  <h1>MultiTool Hub</h1>
  <p>Material 3 Edition</p>
</header>

<div class="tabs">

  <md-filled-button onclick="switchTab('calculator')">
    Calculator
  </md-filled-button>

  <md-filled-button onclick="switchTab('graph')">
    Graph
  </md-filled-button>

  <md-filled-button onclick="switchTab('notes')">
    Notes
  </md-filled-button>

</div>

<!-- CALCULATOR -->
<div class="tab-content active" id="calculator">

  <div class="card">

    <div class="tool-title">
      Calculator
    </div>

    <md-outlined-text-field
      id="calcInput"
      label="Equation"
      value="5*(10+2)">
    </md-outlined-text-field>

    <md-filled-tonal-button onclick="calculate()">
      Calculate
    </md-filled-tonal-button>

    <div id="calcResult">
      Result:
    </div>

  </div>

</div>

<!-- GRAPH -->
<div class="tab-content" id="graph">

  <div class="card">

    <div class="tool-title">
      Graph Tool
    </div>

    <md-outlined-text-field
      id="graphInput"
      label="Function"
      value="Math.sin(x)">
    </md-outlined-text-field>

    <md-filled-tonal-button onclick="drawGraph()">
      Draw Graph
    </md-filled-tonal-button>

    <canvas id="graphCanvas" width="800" height="400"></canvas>

  </div>

</div>

<!-- NOTES -->
<div class="tab-content" id="notes">

  <div class="card">

    <div class="tool-title">
      Notes
    </div>

    <textarea
      id="notesBox"
      placeholder="Write notes here..."></textarea>

    <md-filled-tonal-button onclick="saveNotes()">
      Save Notes
    </md-filled-tonal-button>

    <div class="saved" id="saveStatus"></div>

  </div>

</div>

<footer>
  Material 3 MultiTool Hub © 2026
</footer>

<script>

  // TAB SWITCHING
  function switchTab(id){

    const tabs =
      document.querySelectorAll(".tab-content");

    tabs.forEach(tab=>{
      tab.classList.remove("active");
    });

    document
      .getElementById(id)
      .classList.add("active");
  }

  // CALCULATOR
  function calculate(){

    const input =
      document.getElementById("calcInput").value;

    try{

      const result = eval(input);

      document.getElementById("calcResult")
        .innerText = "Result: " + result;

    } catch {

      document.getElementById("calcResult")
        .innerText = "Invalid expression";

    }
  }

  // NOTES
  const notesBox =
    document.getElementById("notesBox");

  window.onload = ()=>{

    const saved =
      localStorage.getItem("material_notes");

    if(saved){
      notesBox.value = saved;
    }
  }

  function saveNotes(){

    localStorage.setItem(
      "material_notes",
      notesBox.value
    );

    document.getElementById("saveStatus")
      .innerText = "Notes saved!";
  }

  // GRAPH TOOL
  function drawGraph(){

    const canvas =
      document.getElementById("graphCanvas");

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
      0,0,
      canvas.width,
      canvas.height
    );

    // background
    ctx.fillStyle = "white";
    ctx.fillRect(
      0,0,
      canvas.width,
      canvas.height
    );

    // axes
    ctx.strokeStyle = "black";
    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(0, canvas.height/2);
    ctx.lineTo(canvas.width, canvas.height/2);

    ctx.moveTo(canvas.width/2, 0);
    ctx.lineTo(canvas.width/2, canvas.height);

    ctx.stroke();

    const expr =
      document.getElementById("graphInput").value;

    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 2;

    ctx.beginPath();

    for(let px = 0; px < canvas.width; px++){

      let x =
        (px - canvas.width/2) / 35;

      let y;

      try{
        y = eval(expr);
      } catch{
        alert("Invalid function");
        return;
      }

      let py =
        canvas.height/2 - y * 35;

      if(px === 0){
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }

    ctx.stroke();
  }

</script>

</body>
</html>
